<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoJSON 拓扑编辑器 - 框选功能增强版</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        .segment-item { transition: all 0.2s ease; border-left: 4px solid transparent; cursor: pointer; }
        .segment-item.hovered { border-left-color: #3b82f6; background-color: #eff6ff; }
        .segment-item.is-selected { border-left-color: #f59e0b; background-color: #fffbeb; box-shadow: 0 0 0 2px #f59e0b inset; }
        
        .dragging { opacity: 0.4; outline: 2px dashed #3b82f6; }
        .drop-zone { transition: background-color 0.2s ease; min-height: 50px; }
        .drop-zone-active { background-color: #eff6ff !important; border-color: #3b82f6 !important; }

        #loading-overlay {
            position: fixed; inset: 0; background: rgba(255,255,255,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000;
        }

        .selection-active-glow { animation: selection-glow 1.5s infinite; }
        @keyframes selection-glow {
            0% { box-shadow: 0 0 5px rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.8); }
            100% { box-shadow: 0 0 5px rgba(245, 158, 11, 0.4); }
        }

        /* 框选时的鼠标样式 */
        .cursor-crosshair { cursor: crosshair !important; }
    </style>
</head>
<body class="flex h-screen text-gray-800 text-sm">

    <div id="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
        <p class="text-gray-600 font-medium">正在同步工作区...</p>
    </div>

    <!-- 左侧：地图 -->
    <div id="map" class="w-[55%] h-full z-0 relative shadow-inner"></div>

    <!-- 右侧：控制面板 -->
    <div class="w-[45%] h-full flex flex-col bg-gray-100 border-l border-gray-200 z-10 shadow-lg relative">
        
        <!-- 点选模式悬浮条 -->
        <div id="selection-toolbar" class="hidden absolute top-0 inset-x-0 bg-amber-500 text-white p-3 z-[100] flex justify-between items-center shadow-lg selection-active-glow">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-mouse-pointer animate-bounce"></i>
                <div class="flex flex-col">
                    <span class="font-bold leading-tight">点选模式</span>
                    <span class="text-[10px] bg-amber-700 px-1.5 py-0.5 rounded opacity-90">已选 <span id="selection-count">0</span> 个线段</span>
                </div>
            </div>
            <div class="flex gap-2">
                <button id="box-select-btn" onclick="toggleBoxSelect()" class="bg-amber-600 border border-amber-400 text-white px-3 py-1 rounded font-bold hover:bg-amber-700 transition flex items-center gap-1">
                    <i class="fa-solid fa-square-dashed"></i> 矩形框选
                </button>
                <button onclick="confirmBlockSelection()" class="bg-white text-amber-600 px-4 py-1 rounded font-bold hover:bg-amber-50 shadow-sm transition">确认创建</button>
                <button onclick="exitSelectionMode()" class="bg-amber-600 text-white px-4 py-1 rounded font-bold hover:bg-amber-700 transition">取消</button>
            </div>
        </div>

        <!-- 头部与主控制 -->
        <div class="p-3 border-b border-gray-200 bg-white flex-shrink-0 shadow-sm z-20">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-lg font-bold flex items-center gap-2">
                    <i class="fa-solid fa-route text-blue-500"></i> 拓扑编辑器 v5
                </h1>
                <div id="sync-status" class="text-[10px] text-gray-400"><i class="fa-solid fa-database"></i> 离线存储就绪</div>
            </div>
            <textarea id="geojson-input" rows="2" class="w-full p-2 text-xs border rounded focus:ring-1 focus:ring-blue-500 font-mono mb-2" placeholder="粘贴 GeoJSON 数据..."></textarea>
            
            <div class="flex justify-between items-center">
                <div class="flex gap-2">
                    <button onclick="handleLoadAction()" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium shadow-sm"><i class="fa-solid fa-file-import"></i> 解析</button>
                    <button onclick="resolveGlobal()" class="px-3 py-1 bg-blue-500 hover:bg-blue-600 text-white rounded font-medium shadow-sm" title="整理内部，自动接龙，翻转反向的区段"><i class="fa-solid fa-wand-magic-sparkles"></i> 一键整理</button>
                    <button onclick="handleClearAll()" class="px-3 py-1 bg-gray-400 hover:bg-gray-500 text-white rounded font-medium shadow-sm">重置</button>
                </div>
                <div class="flex bg-gray-200 rounded p-0.5 shadow-sm">
                    <button onclick="exportData('1')" class="px-2 py-1 bg-white hover:bg-blue-50 text-blue-600 font-medium border-r border-gray-200">导出上行</button>
                    <button onclick="exportData('2')" class="px-2 py-1 bg-white hover:bg-green-50 text-green-600 font-medium">导出下行</button>
                </div>
            </div>
        </div>

        <!-- 暂存区工具条 -->
        <div class="px-4 py-2 bg-gray-50 border-b border-gray-200 flex justify-between items-center text-xs">
            <div class="flex items-center gap-2 text-orange-600 font-bold">
                <i class="fa-solid fa-boxes-packing"></i> 暂存区: <span id="stash-count">0</span> 项
            </div>
            <button onclick="handleLoadStash()" class="text-indigo-600 hover:text-indigo-800 font-bold flex items-center gap-1">
                <i class="fa-solid fa-rotate-right"></i> 加载全部暂存
            </button>
        </div>

        <!-- 滚动列表 -->
        <div class="flex-1 overflow-y-auto p-3 space-y-4" id="main-scroll-area">
            
            <!-- 待分配池 -->
            <div id="unassigned-container" class="bg-white rounded border border-gray-300 shadow-sm overflow-hidden">
                <div class="bg-gray-100 px-3 py-2 border-b flex justify-between items-center">
                    <span class="font-bold text-gray-600"><i class="fa-solid fa-layer-group text-gray-400"></i> 待处理池 (<span id="unassigned-count">0</span>)</span>
                    <button onclick="enterSelectionMode()" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-full font-bold shadow-md transition transform hover:scale-105 active:scale-95">
                        <i class="fa-solid fa-plus-circle"></i> 点选新建区段
                    </button>
                </div>
                <div class="drop-zone p-2 grid grid-cols-2 gap-2 bg-gray-50 min-h-[60px]" data-type="unassigned" id="unassigned-list" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
                    <!-- 未分配列表 -->
                </div>
            </div>

            <!-- 区段列表 -->
            <div id="blocks-container" class="space-y-4"></div>
            
            <div class="h-20 text-center text-gray-300 flex flex-col items-center justify-center border-2 border-dashed border-gray-200 rounded-lg">
                <i class="fa-solid fa-ellipsis text-2xl mb-1"></i>
                <span>请创建区段进行组织</span>
            </div>
        </div>
    </div>

    <script>
        /**
         * --- 0. 基础工具与存储 ---
         */
        const DB_NAME = 'GeoTopoEditorDB_V5'; 
        const STORE_NAME = 'workspace';
        let db;

        function showToast(msg, isErr = false) {
            const el = document.createElement('div');
            el.className = `fixed top-4 right-4 px-4 py-2 rounded shadow-2xl text-white font-bold z-[9999] transition-all transform translate-y-0 ${isErr ? 'bg-red-500' : 'bg-blue-600'}`;
            el.innerText = msg;
            document.body.appendChild(el);
            setTimeout(() => { el.style.opacity = 0; el.style.transform = 'translateY(-20px)'; setTimeout(()=>el.remove(), 300); }, 3000);
        }

        async function initDB() {
            return new Promise((res) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => e.target.result.createObjectStore(STORE_NAME);
                req.onsuccess = (e) => { db = e.target.result; res(); };
            });
        }

        /**
         * --- 1. 全局状态 ---
         */
        window.state = {
            segmentDict: {},  
            unassigned: [],   
            blocks: [],       
            stashed: { segments: [], blocks: [] },
            selectionMode: false,
            boxSelectActive: false, // 框选工具是否激活
            selectedIds: []   
        };

        window.mapLayers = {};      
        window.decoratorLayers = {}; 
        window.gapLayers = [];      

        const R_EARTH = 6371000; 
        const MERGE_TOLERANCE = 5; 
        const COLORS = { unassigned: '#9ca3af', merged: '#a78bfa', up: '#60a5fa', down: '#34d399', hover: '#3b82f6', selecting: '#f59e0b' };

        window.onload = async () => {
            initMap();
            await initDB();
            const saved = await new Promise(r => {
                const req = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get('current');
                req.onsuccess = () => r(req.result);
            });
            if (saved) { 
                window.state = saved; 
                if(!window.state.stashed) window.state.stashed = { segments: [], blocks: [] };
                updateUI(); 
                fitMapToBounds(); 
            }
            document.getElementById('loading-overlay').style.display = 'none';
        };

        async function triggerPersist() {
            db.transaction(STORE_NAME, 'readwrite').objectStore(STORE_NAME).put(window.state, 'current');
        }

        /**
         * --- 2. 地图初始化与框选插件逻辑 ---
         */
        let boxSelectRect = null;
        let boxStartLatLng = null;

        function initMap() {
            window.map = L.map('map').setView([35.68, 139.76], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OSMC' }).addTo(window.map);

            // 框选模式事件绑定
            window.map.on('mousedown', (e) => {
                if (!window.state.boxSelectActive) return;
                L.DomEvent.stopPropagation(e);
                boxStartLatLng = e.latlng;
                boxSelectRect = L.rectangle([boxStartLatLng, boxStartLatLng], {
                    color: '#f59e0b', weight: 2, fillOpacity: 0.2, dashArray: '5, 5', interactive: false
                }).addTo(window.map);
            });

            window.map.on('mousemove', (e) => {
                if (!boxSelectRect) return;
                boxSelectRect.setBounds(L.latLngBounds(boxStartLatLng, e.latlng));
            });

            window.map.on('mouseup', (e) => {
                if (!boxSelectRect) return;
                const bounds = boxSelectRect.getBounds();
                
                // 执行空间查询：找出落在框内的线段
                let newlySelected = 0;
                for (let id in window.state.segmentDict) {
                    const seg = window.state.segmentDict[id];
                    // 只要有一个点在框内即视为选中
                    const isInside = seg.coords.some(c => bounds.contains([c[1], c[0]]));
                    if (isInside && !window.state.selectedIds.includes(id)) {
                        window.state.selectedIds.push(id);
                        newlySelected++;
                    }
                }
                
                window.map.removeLayer(boxSelectRect);
                boxSelectRect = null;
                
                if (newlySelected > 0) {
                    document.getElementById('selection-count').innerText = window.state.selectedIds.length;
                    updateUI(true);
                }
            });
        }

        /**
         * --- 3. 点选模式逻辑 (含框选开关) ---
         */
        window.enterSelectionMode = () => {
            window.state.selectionMode = true;
            window.state.selectedIds = [];
            document.getElementById('selection-toolbar').classList.remove('hidden');
            document.getElementById('selection-count').innerText = '0';
            updateUI(true); 
        };

        window.toggleBoxSelect = () => {
            window.state.boxSelectActive = !window.state.boxSelectActive;
            const btn = document.getElementById('box-select-btn');
            const mapDiv = document.getElementById('map');
            
            if (window.state.boxSelectActive) {
                window.map.dragging.disable();
                window.map.scrollWheelZoom.disable();
                btn.classList.add('bg-white', 'text-amber-600');
                btn.classList.remove('bg-amber-600', 'text-white');
                mapDiv.classList.add('cursor-crosshair');
                showToast("框选模式已开启，请在地图上拖拽选择线段");
            } else {
                window.map.dragging.enable();
                window.map.scrollWheelZoom.enable();
                btn.classList.remove('bg-white', 'text-amber-600');
                btn.classList.add('bg-amber-600', 'text-white');
                mapDiv.classList.remove('cursor-crosshair');
            }
        };

        window.exitSelectionMode = () => {
            if (window.state.boxSelectActive) toggleBoxSelect(); // 强制关闭框选
            window.state.selectionMode = false;
            window.state.selectedIds = [];
            document.getElementById('selection-toolbar').classList.add('hidden');
            updateUI(true);
        };

        window.toggleSelection = (id) => {
            const idx = window.state.selectedIds.indexOf(id);
            if (idx > -1) window.state.selectedIds.splice(idx, 1);
            else window.state.selectedIds.push(id);
            document.getElementById('selection-count').innerText = window.state.selectedIds.length;
            updateUI(true); 
        };

        window.confirmBlockSelection = () => {
            if (window.state.selectedIds.length === 0) return showToast("未选择任何线段", true);
            
            const newBlockId = 'blk_' + Math.random().toString(36).substr(2, 9);
            const newBlock = { id: newBlockId, type: 'merged', merged: [...window.state.selectedIds], up: [], down: [] };
            
            window.state.selectedIds.forEach(id => {
                if (window.state.unassigned.includes(id)) {
                    window.state.unassigned.splice(window.state.unassigned.indexOf(id), 1);
                } else {
                    window.state.blocks.forEach(b => {
                        ['merged', 'up', 'down'].forEach(t => {
                            const p = b[t].indexOf(id);
                            if (p > -1) b[t].splice(p, 1);
                        });
                    });
                }
            });

            window.state.blocks.push(newBlock);
            showToast(`成功创建区段，包含 ${window.state.selectedIds.length} 条线段`);
            exitSelectionMode();
            triggerPersist();
        };

        /**
         * --- 4. 暂存区 (Stash) 核心逻辑 ---
         */
        window.handleStashBlock = (id) => {
            const idx = window.state.blocks.findIndex(b => b.id === id);
            if (idx > -1) {
                const block = window.state.blocks.splice(idx, 1)[0];
                window.state.stashed.blocks.push(block);
                showToast("已搁置");
                updateUI();
                triggerPersist();
            }
        };

        window.handleStashUnassigned = (id) => {
            const idx = window.state.unassigned.indexOf(id);
            if (idx > -1) {
                const segId = window.state.unassigned.splice(idx, 1)[0];
                window.state.stashed.segments.push(segId);
                showToast("已搁置线段");
                updateUI();
                triggerPersist();
            }
        };

        window.handleLoadStash = () => {
            const s = window.state.stashed;
            const total = s.segments.length + s.blocks.length;
            if (total === 0) return showToast("暂存区为空", true);
            window.state.unassigned.push(...s.segments);
            window.state.blocks.push(...s.blocks);
            window.state.stashed = { segments: [], blocks: [] };
            showToast(`已恢复 ${total} 个暂存项`);
            updateUI();
            fitMapToBounds();
            triggerPersist();
        };

        /**
         * --- 5. 基础解析与导出 ---
         */
        function handleLoadAction() {
            const input = document.getElementById('geojson-input').value.trim();
            if (!input) return;
            let rawData; try { rawData = JSON.parse(input); } catch(e) { return showToast("JSON无效", true); }

            let coordsArray = [];
            function extract(obj) {
                if (!obj) return;
                if (obj.type === 'FeatureCollection') obj.features.forEach(extract);
                else if (obj.type === 'Feature') extract(obj.geometry);
                else if (obj.type === 'MultiLineString') coordsArray.push(...obj.coordinates);
                else if (obj.type === 'LineString') coordsArray.push(obj.coordinates);
            }
            extract(rawData);
            
            coordsArray.forEach(coords => {
                let id = 'seg_' + Math.random().toString(36).substr(2, 9);
                window.state.segmentDict[id] = { id, coords, length: calculateLength(coords) };
                window.state.unassigned.push(id);
            });

            document.getElementById('geojson-input').value = '';
            updateUI(); fitMapToBounds(); triggerPersist();
        }

        window.handleClearAll = () => {
            if(!confirm("确定清空活跃工作区？")) return;
            window.state.unassigned = [];
            window.state.blocks = [];
            updateUI(); triggerPersist();
        };

        /**
         * --- 6. 辅助算法 ---
         */
        // 翻转线段列表（顺序及内部坐标）
        window.reverseSegmentList = (list) => {
            list.reverse();
            list.forEach(id => {
                window.state.segmentDict[id].coords.reverse();
            });
        };

        // 内部整理：自动接龙线段（不判断全局方向，仅做内部连续性连接，流向以第一条线段为准）
        window.resolveSegmentList = (list) => {
            if (list.length <= 1) return;

            let sorted = [list.shift()];
            while (list.length > 0) {
                let tailId = sorted[sorted.length - 1];
                let tailCoords = window.state.segmentDict[tailId].coords;
                let tailEnd = tailCoords[tailCoords.length - 1];

                let headId = sorted[0];
                let headCoords = window.state.segmentDict[headId].coords;
                let headStart = headCoords[0];

                let foundIndex = -1;
                let needReverse = false;
                let addToFront = false; // 是否应该接到车头前

                for (let i = 0; i < list.length; i++) {
                    let candId = list[i];
                    let candCoords = window.state.segmentDict[candId].coords;
                    let candStart = candCoords[0];
                    let candEnd = candCoords[candCoords.length - 1];

                    // 检查接车尾
                    if (getDistance(tailEnd, candStart) <= MERGE_TOLERANCE) {
                        foundIndex = i;
                        break;
                    } else if (getDistance(tailEnd, candEnd) <= MERGE_TOLERANCE) {
                        foundIndex = i;
                        needReverse = true;
                        break;
                    }
                    // 检查接车头
                    else if (getDistance(headStart, candEnd) <= MERGE_TOLERANCE) {
                        foundIndex = i;
                        addToFront = true;
                        break;
                    } else if (getDistance(headStart, candStart) <= MERGE_TOLERANCE) {
                        foundIndex = i;
                        needReverse = true;
                        addToFront = true;
                        break;
                    }
                }

                if (foundIndex > -1) {
                    let nextId = list.splice(foundIndex, 1)[0];
                    if (needReverse) {
                        window.state.segmentDict[nextId].coords.reverse();
                    }
                    if (addToFront) {
                        sorted.unshift(nextId);
                    } else {
                        sorted.push(nextId);
                    }
                } else {
                    // 如果断头了，先把剩下的第一个强行塞进来继续排（按车尾方向塞入）
                    sorted.push(list.shift());
                }
            }

            // 将排好的塞回去
            list.push(...sorted);
        };

        // 翻转整个 Block
        window.flipBlockData = (id) => {
            const b = window.state.blocks.find(x => x.id === id);
            if (!b) return;
            if (b.type === 'merged') {
                window.reverseSegmentList(b.merged);
            } else if (b.type === 'split') {
                window.reverseSegmentList(b.up);
                window.reverseSegmentList(b.down);
                let temp = b.up;
                b.up = b.down;
                b.down = temp;
            }
        };

        window.flipBlock = (id) => {
            window.flipBlockData(id);
            updateUI(); triggerPersist();
        };

        // 整理内部
        window.resolveInternal = (id) => {
            const b = window.state.blocks.find(x => x.id === id);
            if (!b) return;
            if (b.type === 'merged') {
                window.resolveSegmentList(b.merged);
            } else if (b.type === 'split') {
                window.resolveSegmentList(b.up);
                window.resolveSegmentList(b.down);
            }
            updateUI(); triggerPersist();
        };

        // 翻转单独列表 UI 回调
        window.handleReverseList = (blockId, listType) => {
            const b = window.state.blocks.find(x => x.id === blockId);
            if (!b || !b[listType]) return;
            window.reverseSegmentList(b[listType]);
            updateUI(); triggerPersist();
        };

        // 全局整理：先整理内部，再接龙所有 Blocks，独立调整上下行方向以匹配标准流向
        window.resolveGlobal = () => {
            if (window.state.blocks.length <= 1) {
                if (window.state.blocks.length === 1) window.resolveInternal(window.state.blocks[0].id);
                return;
            }

            // 1. 先进行初步的内部连续性整理（无论方向对错，先连起来）
            window.state.blocks.forEach(b => {
                if (b.type === 'merged') window.resolveSegmentList(b.merged);
                else { window.resolveSegmentList(b.up); window.resolveSegmentList(b.down); }
            });

            // 2. Blocks 独立轨道匹配与接龙排序 (Track-by-Track Matching)
            // 标准流向定义：
            // A -> B (整体推进方向)
            // up: 从 A 到 B (起点在 A)
            // down: 从 B 到 A (起点在 B，终点在 A)
            let list = [...window.state.blocks];
            let sorted = [list.shift()];

            // 辅助函数：根据端点判断是否匹配
            const isMatch = (p1, p2) => p1 && p2 && getDistance(p1, p2) <= MERGE_TOLERANCE;

            while (list.length > 0) {
                let tailBlock = sorted[sorted.length - 1];
                let tailEndpoints = getBlockEndpoints(tailBlock);
                if (!tailEndpoints) {
                    sorted.push(list.shift());
                    continue;
                }

                let foundIndex = -1;
                // 分别记录候选区块中 up/down/merged 轨道的反转需求，不再进行整体 Block Flip
                let flipUp = false;
                let flipDown = false;
                let flipMerged = false;

                // 我们正在寻找能接在 Tail 之后的候选区块 Candidate
                // Tail 提供：upEnd (即 upRight) 和 downStart (即 downRight) 作为挂接点
                let tailUpEnd = tailEndpoints.upRight;
                let tailDownStart = tailEndpoints.downRight;
                // 合并轨道兼容两端：可作为 upEnd 或 downStart
                if (tailBlock.type === 'merged') {
                    tailUpEnd = tailEndpoints.upRight;
                    tailDownStart = tailEndpoints.upRight;
                }

                for (let i = 0; i < list.length; i++) {
                    let candBlock = list[i];
                    let candEndpoints = getBlockEndpoints(candBlock);
                    if (!candEndpoints) continue;

                    let matchFound = false;

                    if (candBlock.type === 'merged') {
                        let candStart = candEndpoints.upLeft;
                        let candEnd = candEndpoints.upRight;

                        // 检查是否能接在 Tail 后面
                        if (isMatch(tailUpEnd, candStart) || isMatch(tailDownStart, candStart)) {
                            matchFound = true;
                        } else if (isMatch(tailUpEnd, candEnd) || isMatch(tailDownStart, candEnd)) {
                            matchFound = true;
                            flipMerged = true;
                        }
                    } else if (candBlock.type === 'split') {
                        let candUpStart = candEndpoints.upLeft;
                        let candUpEnd = candEndpoints.upRight;

                        // 注意：down 的流向应该是从 right 到 left。
                        // 所以 candDownStart 是几何上的 right，candDownEnd 是几何上的 left。
                        // 这里我们独立拿着 tailUpEnd 去碰 cand 的 up，拿着 tailDownStart 去碰 cand 的 down
                        let candDownStart = candEndpoints.downRight; // 几何终点（靠近 B）
                        let candDownEnd = candEndpoints.downLeft;   // 几何起点（靠近 A）

                        let upMatched = false;
                        let downMatched = false;

                        // 独立判断 up 连接
                        if (isMatch(tailUpEnd, candUpStart)) {
                            upMatched = true;
                        } else if (isMatch(tailUpEnd, candUpEnd)) {
                            upMatched = true;
                            flipUp = true;
                        }

                        // 独立判断 down 连接
                        // Tail 的 downStart (它在 B 端) 应该连接 Candidate 的 downEnd (即靠近 A 端的起点)
                        if (isMatch(tailDownStart, candDownEnd)) {
                            downMatched = true;
                        } else if (isMatch(tailDownStart, candDownStart)) {
                            downMatched = true;
                            flipDown = true;
                        }

                        if (upMatched || downMatched) {
                            matchFound = true;
                            // 如果只有单边匹配上了，另一边我们通过它自己的默认方向判定，
                            // 不过既然我们正在从左往右理，我们姑且认为没匹配上的边如果不反转也能顺下去（由于刚才没有整体Flip了，所以这里单独留白即可）。
                        }
                    }

                    if (matchFound) {
                        foundIndex = i;
                        break;
                    }
                }

                if (foundIndex > -1) {
                    let nextBlock = list.splice(foundIndex, 1)[0];
                    if (nextBlock.type === 'merged' && flipMerged) {
                        window.reverseSegmentList(nextBlock.merged);
                    } else if (nextBlock.type === 'split') {
                        if (flipUp) window.reverseSegmentList(nextBlock.up);
                        if (flipDown) window.reverseSegmentList(nextBlock.down);
                    }
                    sorted.push(nextBlock);
                } else {
                    sorted.push(list.shift());
                }
            }

            window.state.blocks = sorted;
            updateUI(); triggerPersist();
            showToast("全局整理完毕");
        };

        function getDistance(p1, p2) {
            const rad = Math.PI / 180;
            const a = 0.5 - Math.cos((p2[1] - p1[1]) * rad)/2 + Math.cos(p1[1] * rad) * Math.cos(p2[1] * rad) * (1 - Math.cos((p2[0] - p1[0]) * rad))/2;
            return R_EARTH * 2 * Math.asin(Math.sqrt(a));
        }

        function calculateLength(coords) {
            let l = 0;
            for(let i=0; i<coords.length-1; i++) l += getDistance(coords[i], coords[i+1]);
            return l;
        }

        function getBlockEndpoints(b) {
            let upLeft = null, upRight = null, downLeft = null, downRight = null;
            if (b.type === 'merged' && b.merged.length) {
                upLeft = window.state.segmentDict[b.merged[0]].coords[0];
                upRight = window.state.segmentDict[b.merged[b.merged.length-1]].coords.slice(-1)[0];
                downLeft = upLeft;
                downRight = upRight;
                return { upLeft, upRight, downLeft, downRight };
            }
            if (b.type === 'split') {
                if (b.up.length) {
                    upLeft = window.state.segmentDict[b.up[0]].coords[0];
                    upRight = window.state.segmentDict[b.up[b.up.length-1]].coords.slice(-1)[0];
                }
                if (b.down.length) {
                    // Note: 'downLeft' and 'downRight' are defined relative to the 'up' direction's progression.
                    // This means `downLeft` is physically on the same side as `upLeft` in space.
                    // However, because the train flows from `downRight` to `downLeft`,
                    // the first segment in the 'down' array should be placed such that `[0]` represents `downRight`.
                    // To accurately extract 'downLeft' and 'downRight', we just take the pure geometric ends of the current list.
                    // It is the caller's responsibility to orient it correctly.
                    // So we assign `downLeft` = end, `downRight` = start. If it's correctly sorted, `downRight` flows to `downLeft`.
                    downRight = window.state.segmentDict[b.down[0]].coords[0];
                    downLeft = window.state.segmentDict[b.down[b.down.length-1]].coords.slice(-1)[0];
                }
                if (upLeft || downLeft) return { upLeft, upRight, downLeft, downRight };
            }
            return null;
        }

        /**
         * --- 7. 拖拽逻辑 ---
         */
        window.handleDragStart = (e, id) => {
            if (window.state.selectionMode) { e.preventDefault(); return; }
            window.draggedId = id;
            e.target.classList.add('dragging');
        };

        window.handleDragOver = (e) => { e.preventDefault(); e.target.closest('.drop-zone')?.classList.add('drop-zone-active'); };
        window.handleDragLeave = (e) => e.target.closest('.drop-zone')?.classList.remove('drop-zone-active');

        window.handleDrop = (e) => {
            e.preventDefault();
            const dz = e.target.closest('.drop-zone');
            if (!dz || !window.draggedId) return;
            dz.classList.remove('drop-zone-active');

            const targetType = dz.dataset.type;
            const targetBlk = dz.dataset.block;
            
            Object.values(window.state.blocks).forEach(b => { ['merged', 'up', 'down'].forEach(t => {
                const idx = b[t].indexOf(window.draggedId);
                if(idx > -1) b[t].splice(idx, 1);
            })});
            const uIdx = window.state.unassigned.indexOf(window.draggedId);
            if(uIdx > -1) window.state.unassigned.splice(uIdx, 1);

            let list = targetType === 'unassigned' ? window.state.unassigned : window.state.blocks.find(b=>b.id===targetBlk)[targetType];
            const targetSeg = e.target.closest('.segment-item')?.dataset.id;
            if (targetSeg) list.splice(list.indexOf(targetSeg), 0, window.draggedId);
            else list.push(window.draggedId);

            updateUI(); triggerPersist();
        };

        /**
         * --- 8. 渲染核心 ---
         */
        function renderSegmentList(ids, context) {
            let html = '';
            ids.forEach((id) => {
                const seg = window.state.segmentDict[id];
                const isSelected = window.state.selectedIds.includes(id);
                
                html += `
                <div class="segment-item bg-white border border-gray-200 p-2 rounded shadow-sm flex items-center justify-between ${isSelected ? 'is-selected' : ''}" 
                     data-id="${id}" draggable="${!window.state.selectionMode}" ondragstart="handleDragStart(event, '${id}')" 
                     onmouseenter="setHover('${id}')" onmouseleave="setHover(null)"
                     onclick="handleItemClick('${id}')">
                    <div class="overflow-hidden pr-2">
                        <div class="font-mono text-[10px] text-gray-400">#${id.slice(-4)}</div>
                        <div class="font-bold text-gray-700">${(seg.length/1000).toFixed(2)} km</div>
                    </div>
                    <div class="flex gap-1" onclick="event.stopPropagation()">
                         <button onclick="window.state.segmentDict['${id}'].coords.reverse(); updateUI(); triggerPersist();" class="text-gray-300 hover:text-purple-500 p-1" title="翻转"><i class="fa-solid fa-sync text-[10px]"></i></button>
                         ${context === 'unassigned' ? `<button onclick="handleStashUnassigned('${id}')" class="text-gray-300 hover:text-orange-500 p-1" title="搁置"><i class="fa-solid fa-boxes-packing text-[10px]"></i></button>` : ''}
                    </div>
                </div>`;
            });
            return html;
        }

        window.handleItemClick = (id) => {
            if (window.state.selectionMode) window.toggleSelection(id);
            else focusSegment(id);
        };

        function updateUI(redrawMap = true) {
            document.getElementById('unassigned-count').innerText = window.state.unassigned.length;
            document.getElementById('stash-count').innerText = window.state.stashed.segments.length + window.state.stashed.blocks.length;
            
            if (redrawMap) {
                Object.values(window.mapLayers).forEach(o => window.map.removeLayer(o.layer));
                Object.values(window.decoratorLayers).forEach(l => window.map.removeLayer(l));
                window.gapLayers.forEach(l => window.map.removeLayer(l));
                window.mapLayers = {}; window.decoratorLayers = {}; window.gapLayers = [];
            }

            document.getElementById('unassigned-list').innerHTML = renderSegmentList(window.state.unassigned, 'unassigned');

            const container = document.getElementById('blocks-container');
            let blocksHtml = '';
            let prevEnd = null;

            window.state.blocks.forEach((b, idx) => {
                const endpoints = getBlockEndpoints(b);
                if (prevEnd && endpoints) {
                    // Check up connection
                    const prevUpEnd = prevEnd.upRight;
                    const curUpStart = endpoints.upLeft;
                    let dUp = 0;
                    let hasUpGap = false;
                    if (prevUpEnd && curUpStart) {
                        dUp = getDistance(prevUpEnd, curUpStart);
                        if (dUp > MERGE_TOLERANCE) {
                            hasUpGap = true;
                            if (redrawMap) window.gapLayers.push(L.polyline([[prevUpEnd[1], prevUpEnd[0]], [curUpStart[1], curUpStart[0]]], {color:'#ef4444', weight:3, dashArray:'5,5'}).addTo(window.map));
                        }
                    }

                    // Check down connection
                    const prevDownEnd = prevEnd.downRight;
                    const curDownStart = endpoints.downLeft;
                    let dDown = 0;
                    let hasDownGap = false;
                    if (prevDownEnd && curDownStart) {
                        dDown = getDistance(prevDownEnd, curDownStart);
                        if (dDown > MERGE_TOLERANCE) {
                            hasDownGap = true;
                            if (redrawMap) window.gapLayers.push(L.polyline([[prevDownEnd[1], prevDownEnd[0]], [curDownStart[1], curDownStart[0]]], {color:'#ef4444', weight:3, dashArray:'5,5'}).addTo(window.map));
                        }
                    }

                    if (hasUpGap || hasDownGap) {
                        let gapText = '';
                        if (hasUpGap && hasDownGap) {
                            // If both gaps exist, display them. If they are very similar, maybe display once, but better to display both for clarity or merged if identical.
                            if (Math.abs(dUp - dDown) < 1) {
                                gapText = `上下行间距: ${(dUp/1000).toFixed(2)}km`;
                            } else {
                                gapText = `上行: ${(dUp/1000).toFixed(2)}km | 下行: ${(dDown/1000).toFixed(2)}km`;
                            }
                        } else if (hasUpGap) {
                            gapText = `上行间距: ${(dUp/1000).toFixed(2)}km`;
                        } else if (hasDownGap) {
                            gapText = `下行间距: ${(dDown/1000).toFixed(2)}km`;
                        }
                        blocksHtml += `<div class="text-center -my-2 relative z-20"><span class="bg-red-500 text-white px-3 py-0.5 rounded-full text-[10px] font-bold shadow-md tracking-tighter">${gapText}</span></div>`;
                    }
                }
                if(endpoints) prevEnd = endpoints;

                const trackHtml = b.type === 'merged' ? 
                    `<div class="relative drop-zone p-2 space-y-1 bg-purple-50/30" data-type="merged" data-block="${b.id}" ondragover="handleDragOver(event)" ondrop="handleDrop(event)">
                        <button onclick="handleReverseList('${b.id}', 'merged')" class="absolute top-1 right-1 text-[10px] text-purple-600 bg-white/80 rounded px-1 shadow-sm hover:bg-white" title="翻转列表"><i class="fa-solid fa-sync"></i></button>
                        ${renderSegmentList(b.merged, 'merged')}
                    </div>` :
                    `<div class="flex divide-x divide-gray-200">
                        <div class="relative w-1/2 p-2 drop-zone bg-blue-50/10" data-type="up" data-block="${b.id}" ondragover="handleDragOver(event)" ondrop="handleDrop(event)">
                            <button onclick="handleReverseList('${b.id}', 'up')" class="absolute top-1 right-1 text-[10px] text-blue-600 bg-white/80 rounded px-1 shadow-sm hover:bg-white" title="翻转列表"><i class="fa-solid fa-sync"></i></button>
                            ${renderSegmentList(b.up, 'up')}
                        </div>
                        <div class="relative w-1/2 p-2 drop-zone bg-green-50/10" data-type="down" data-block="${b.id}" ondragover="handleDragOver(event)" ondrop="handleDrop(event)">
                            <button onclick="handleReverseList('${b.id}', 'down')" class="absolute top-1 right-1 text-[10px] text-green-600 bg-white/80 rounded px-1 shadow-sm hover:bg-white" title="翻转列表"><i class="fa-solid fa-sync"></i></button>
                            ${renderSegmentList(b.down, 'down')}
                        </div>
                    </div>`;

                blocksHtml += `
                <div class="bg-white rounded border border-gray-300 shadow-sm overflow-hidden">
                    <div class="bg-gray-100 px-3 py-2 flex justify-between items-center">
                        <span class="font-bold flex items-center gap-1"><i class="fa-solid fa-layer-group text-blue-400"></i> ${idx+1}</span>
                        <div class="flex gap-2">
                            <button onclick="moveBlock(${idx}, -1)" class="text-gray-400 hover:text-gray-600 px-1"><i class="fa-solid fa-chevron-up"></i></button>
                            <button onclick="moveBlock(${idx}, 1)" class="text-gray-400 hover:text-gray-600 px-1"><i class="fa-solid fa-chevron-down"></i></button>
                            <button onclick="toggleBlockType('${b.id}')" class="text-[10px] bg-white border border-gray-300 px-2 py-0.5 rounded shadow-sm text-blue-600">${b.type==='merged'?'拆分轨道':'合并轨道'}</button>
                            <button onclick="resolveInternal('${b.id}')" class="text-gray-400 hover:text-blue-500 px-1" title="整理内部"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
                            <button onclick="flipBlock('${b.id}')" class="text-gray-400 hover:text-purple-500 px-1" title="翻转区段"><i class="fa-solid fa-sync"></i></button>
                            <button onclick="handleStashBlock('${b.id}')" class="text-gray-400 hover:text-orange-500 px-1"><i class="fa-solid fa-boxes-packing"></i></button>
                            <button onclick="deleteBlock('${b.id}')" class="text-gray-300 hover:text-red-500 px-1"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    ${trackHtml}
                </div>`;
            });
            container.innerHTML = blocksHtml;

            if(redrawMap) {
                window.state.unassigned.forEach(id => drawOnMap(id, 'unassigned'));
                window.state.blocks.forEach(b => {
                    if(b.type === 'merged') b.merged.forEach(id => drawOnMap(id, 'merged'));
                    else { b.up.forEach(id => drawOnMap(id, 'up')); b.down.forEach(id => drawOnMap(id, 'down')); }
                });
            }
        }

        function drawOnMap(id, type) {
            const seg = window.state.segmentDict[id];
            const isSelected = window.state.selectedIds.includes(id);
            const color = isSelected ? COLORS.selecting : COLORS[type];
            const latlngs = seg.coords.map(c => [c[1], c[0]]);
            const line = L.polyline(latlngs, { color, weight: isSelected ? 6 : 4, opacity: 0.8 }).addTo(window.map);
            window.decoratorLayers[id] = L.polylineDecorator(line, { patterns: [{ offset: '50%', repeat: 0, symbol: L.Symbol.arrowHead({pixelSize: 10, pathOptions: {fillOpacity: 1, weight: 0, color: '#1f2937'}}) }] }).addTo(window.map);
            line.on('click', (e) => { L.DomEvent.stopPropagation(e); handleItemClick(id); });
            line.on('mouseover', () => setHover(id));
            line.on('mouseout', () => setHover(null));
            window.mapLayers[id] = { layer: line, baseColor: COLORS[type] };
        }

        window.setHover = (id) => {
            document.querySelectorAll('.segment-item').forEach(el => {
                if (el.dataset.id === id) el.classList.add('hovered');
                else el.classList.remove('hovered');
            });
            for (let k in window.mapLayers) {
                const isSel = window.state.selectedIds.includes(k);
                const obj = window.mapLayers[k];
                if (k === id) obj.layer.setStyle({ color: COLORS.hover, weight: 8 }).bringToFront();
                else obj.layer.setStyle({ color: isSel ? COLORS.selecting : obj.baseColor, weight: isSel ? 6 : 4 });
            }
        };

        window.focusSegment = (id) => {
            const l = window.mapLayers[id]?.layer;
            if (l) window.map.fitBounds(l.getBounds(), { padding: [100, 100], maxZoom: 16 });
        };

        /**
         * --- 9. 区段操作 ---
         */
        window.toggleBlockType = (id) => {
            const b = window.state.blocks.find(x => x.id === id);
            if (b.type === 'merged') { b.type = 'split'; b.up = [...b.merged]; b.merged = []; }
            else { b.type = 'merged'; b.merged = [...b.up, ...b.down]; b.up = []; b.down = []; }
            updateUI(); triggerPersist();
        };

        window.deleteBlock = (id) => {
            const idx = window.state.blocks.findIndex(b=>b.id===id);
            if(idx > -1) {
                const b = window.state.blocks.splice(idx, 1)[0];
                window.state.unassigned.push(...b.merged, ...b.up, ...b.down);
                updateUI(); triggerPersist();
            }
        };

        window.moveBlock = (idx, step) => {
            const target = idx + step;
            if (target < 0 || target >= window.state.blocks.length) return;
            [window.state.blocks[idx], window.state.blocks[target]] = [window.state.blocks[target], window.state.blocks[idx]];
            updateUI(); triggerPersist();
        };

        function fitMapToBounds() {
            const all = [];
            Object.values(window.state.segmentDict).forEach(s => s.coords.forEach(c => all.push([c[1], c[0]])));
            if (all.length) window.map.fitBounds(L.latLngBounds(all), { padding: [40, 40] });
        }

        window.exportData = (type) => {
            let out = [];
            if (type === '1') {
                window.state.blocks.forEach(b => {
                    const list = b.type === 'merged' ? b.merged : b.up;
                    list.forEach(id => out.push(window.state.segmentDict[id].coords));
                });
            } else {
                [...window.state.blocks].reverse().forEach(b => {
                    if (b.type === 'merged') [...b.merged].reverse().forEach(id => out.push([...window.state.segmentDict[id].coords].reverse()));
                    else b.down.forEach(id => out.push(window.state.segmentDict[id].coords));
                });
            }
            if(out.length === 0) return showToast("工作区无可导出内容", true);
            const blob = new Blob([JSON.stringify({ type: "Feature", geometry: { type: "MultiLineString", coordinates: out } }, null, 2)], {type: "application/json"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `topo_${type==='1'?'upbound':'downbound'}_${Date.now()}.geojson`; a.click();
            showToast("文件已下载");
        };

    </script>
</body>
</html>
